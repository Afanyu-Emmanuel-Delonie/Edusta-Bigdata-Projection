{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_title }}</title>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Tailwind -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.3.3/dist/tailwind.min.css" rel="stylesheet">
</head>

<body class="bg-gray-100 font-sans p-6">

    <h1 class="text-3xl font-bold mb-6 text-[#051d40]">{{ page_title }}</h1>

    <!-- KPI Section -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-10">
        {% for kpi_name, kpi_value in kpis.items %}
        <div class="bg-white shadow rounded p-4 text-center">
            <h2 class="text-lg font-semibold">{{ kpi_name }}</h2>
            <p class="text-2xl">{{ kpi_value|default:0 }}</p>
        </div>
        {% endfor %}
    </div>

    <!-- Charts Section -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

        <!-- Pass/Fail Pie Chart -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Pass/Fail Distribution</h2>
            <canvas id="passFailChart"></canvas>
        </div>

        <!-- Feature Importance -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Feature Importance</h2>
            <canvas id="featureImportanceChart"></canvas>
        </div>

        <!-- Confusion Matrix -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Confusion Matrix</h2>
            <canvas id="confusionMatrixChart"></canvas>
        </div>

    </div>

    <!-- Additional Charts -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-10">

        <!-- Score Distribution -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Score Distribution</h2>
            <canvas id="distributionChart"></canvas>
        </div>

        <!-- Status Pie Chart -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Status Distribution</h2>
            <canvas id="statusPieChart"></canvas>
        </div>

        <!-- Course Comparison -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Course Comparison</h2>
            <canvas id="courseComparisonChart"></canvas>
        </div>

        <!-- Semester Trend -->
        <div class="bg-white shadow rounded p-4">
            <h2 class="text-xl font-semibold mb-2">Semester Trend</h2>
            <canvas id="semesterTrendChart"></canvas>
        </div>

    </div>

    <!-- ========================= -->
    <!--         SCRIPTS           -->
    <!-- ========================= -->
    <script>
        // =========================
        // ML Charts
        // =========================

        const passFailData = {{ pass_fail_distribution|safe }};
        const ctxPassFail = document.getElementById('passFailChart').getContext('2d');
        new Chart(ctxPassFail, {
            type: 'pie',
            data: {
                labels: Object.keys(passFailData),
                datasets: [{
                    label: 'Pass/Fail',
                    data: Object.values(passFailData),
                    backgroundColor: ['#34d399', '#f87171']
                }]
            },
            options: { responsive: true, plugins: { legend: { position: 'bottom' } } }
        });

        const featureData = {{ feature_importance|safe }};
        const ctxFeature = document.getElementById('featureImportanceChart').getContext('2d');
        new Chart(ctxFeature, {
            type: 'bar',
            data: {
                labels: featureData.map(f => f.Feature),
                datasets: [{ label: 'Importance', data: featureData.map(f => f.Importance), backgroundColor: '#3b82f6' }]
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } }, plugins: { legend: { display: false } } }
        });

        const cmData = {{ confusion_matrix_data|safe }};
        const ctxCM = document.getElementById('confusionMatrixChart').getContext('2d');
        const cmLabels = cmData.map((_, i) => 'Class ' + (i + 1));
        new Chart(ctxCM, {
            type: 'bar',
            data: {
                labels: cmLabels,
                datasets: cmData.map((row, i) => ({
                    label: 'Actual ' + (i + 1),
                    data: row,
                    backgroundColor: `hsl(${i * 60}, 70%, 50%)`
                }))
            },
            options: { responsive: true, scales: { y: { beginAtZero: true } }, plugins: { legend: { position: 'bottom' } } }
        });

        // =========================
        // Standard Charts
        // =========================

        const charts = {{ charts|safe }};

        const ctxDistribution = document.getElementById('distributionChart').getContext('2d');
        new Chart(ctxDistribution, charts.distribution);

        const ctxStatusPie = document.getElementById('statusPieChart').getContext('2d');
        new Chart(ctxStatusPie, charts.status_pie);

        const ctxCourseComp = document.getElementById('courseComparisonChart').getContext('2d');
        new Chart(ctxCourseComp, charts.course_comparison);

        const ctxSemesterTrend = document.getElementById('semesterTrendChart').getContext('2d');
        new Chart(ctxSemesterTrend, charts.semester_trend);

    </script>

</body>
</html>
